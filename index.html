<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090d">
  <meta name="description" content="Something special is coming soon.">
  <title>Coming Soon</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="page">
    <video id="backgroundVideo" class="background-video" autoplay muted loop playsinline webkit-playsinline preload="auto">
      <source src="/coming-soon-portrait-4k.mp4" type="video/mp4">
      Your browser does not support HTML video.
    </video>
    <div class="shade" aria-hidden="true"></div>
    <section class="content">
      <span class="eyebrow"><span class="pulse"></span> SOMETHING NEW IS ON THE WAY</span>
      <h1>Coming<br><span>Soon.</span></h1>
      <p>We’re getting everything ready.<br>Stay tuned for the reveal.</p>
      <div class="rule"></div>
      <span class="small">A NEW EXPERIENCE IS ALMOST HERE</span>
    </section>
    <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="false">Enable sound <span aria-hidden="true">↗</span></button>
    <span class="corner-mark" aria-hidden="true">CS<span>®</span></span>
    <div class="video-error" id="videoError" hidden>
      The video could not load. Please check that the MP4 file is uploaded in the repository root.
    </div>
    <button class="retry-button" id="retryButton" type="button" hidden>Play video</button>
  </main>
  <script>
    const video = document.getElementById('backgroundVideo');
    const soundToggle = document.getElementById('soundToggle');
    const videoError = document.getElementById('videoError');
    const retryButton = document.getElementById('retryButton');

    async function startVideo() {
      video.muted = true;
      try {
        await video.play();
        videoError.hidden = true;
        retryButton.hidden = true;
      } catch (error) {
        // Some mobile browsers block autoplay until the visitor interacts.
        retryButton.hidden = false;
      }
    }

    video.addEventListener('error', () => {
      videoError.hidden = false;
      retryButton.hidden = true;
    });
    video.addEventListener('ended', () => {
      video.currentTime = 0;
      startVideo();
    });
    retryButton.addEventListener('click', startVideo);
    soundToggle.addEventListener('click', async () => {
      video.muted = !video.muted;
      soundToggle.setAttribute('aria-pressed', String(!video.muted));
      soundToggle.innerHTML = video.muted
        ? 'Enable sound <span aria-hidden="true">↗</span>'
        : 'Mute sound <span aria-hidden="true">↗</span>';
      if (video.paused) await startVideo();
    });
    startVideo();
  </script>
</body>
</html>
