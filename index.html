
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Coming Soon</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <video
    id="backgroundVideo"
    autoplay
    muted
    loop
    playsinline
    preload="auto">
  </video>

  <script>
    const video = document.getElementById("backgroundVideo");
    const mobileScreen = window.matchMedia("(max-width: 767px)");

    function selectVideo() {
      const file = mobileScreen.matches
        ? "/mobile-coming-soon.mp4"
        : "/desktop-coming-soon.mp4";

      if (video.dataset.currentFile === file) return;

      video.dataset.currentFile = file;
      video.src = file;
      video.load();

      video.play().catch(() => {
        // Autoplay may require user interaction in some browsers.
      });
    }

    selectVideo();

    if (mobileScreen.addEventListener) {
      mobileScreen.addEventListener("change", selectVideo);
    } else {
      mobileScreen.addListener(selectVideo);
    }
  </script>
</body>
</html>
